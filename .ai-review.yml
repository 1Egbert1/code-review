# 本仓库自用配置，同时作为示例。
#
# 只写「和默认值不同」的项：默认值见 src/config/defaults.ts，重复抄一遍
# 只会在改默认值时不同步，反而更乱。

platform:
  kind: github
  tokenEnv: GITHUB_TOKEN

llm:
  preset: deepseek
  # 官方文档给的 base URL 不带 /v1；带 /v1 也能通，但以文档为准
  baseUrl: https://api.deepseek.com
  # 2026-11 核实：模型名是 deepseek-flash（不是 deepseek-chat，那个已不在文档里）
  model: deepseek-flash
  apiKeyEnv: AI_REVIEW_API_KEY
  # 模型标称 1M。这里按 128K 算预算：单次审查用不到那么长，而超长上下文的
  # 召回质量下降是普遍现象（具体衰减幅度各模型不同，未实测）。宁少勿多是保守选择。
  contextWindow: 128000
  maxOutputTokens: 4096
  structuredOutput: auto
  # 单价随时会变，这里填的是 2026-11-03 查到的峰值价（每 100 万 token，美元）。
  # 不填的话 estimatedCostUsd 会是 null——「不知道」而不是「零」。
  pricing:
    inputPerMTok: 0.3
    outputPerMTok: 1.2
    # DeepSeek 的缓存是自动的，不收写入费
    cacheWriteShortMultiplier: 0
    cacheWriteLongMultiplier: 0
    # 缓存命中价 0.006 / 未命中 0.3 = 1/50
    cacheReadMultiplier: 0.02

review:
  # 构建产物、样本与 Markdown 文档（含 README）不进审查：既没意义，还会把 token
  # 烧在压缩代码和几千行的文档上。注意 skipPaths 是整组**覆盖**默认值而不是追加，
  # 所以这里一旦写了这一节，就必须把默认清单里的 `**/*.md` 一起带上。
  skipPaths:
    - '**/*.lock'
    - 'dist/**'
    - 'fixtures/**'
    - 'evals/**'
    - '**/*.md'
  maxInlineComments: 10
  dimensions:
    correctness:
      enabled: true
      severityFloor: minor
    security:
      enabled: true
      severityFloor: minor
    convention:
      enabled: true
      severityFloor: minor

# 门禁默认关闭：先在真实仓库上跑几轮，确认误报率可接受再打开
gate:
  enabled: false

inspection:
  enabled: true
  # 报告写成常设 Issue；仓库开了 Wiki 时自动优先用 Wiki
  carrier: auto
