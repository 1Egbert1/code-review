# 定期巡检。
#
# 三个要点：
# 1. 用 schedule 事件，不涉及 PR，所以没有「不可信代码进执行环境」的问题。
# 2. **这里确实 checkout 了主分支**，但目的不是让 Action 读代码——它通过接口读。
#    checkout 只为了把本期历史写回 `.acr/inspection-history.json` 并提交。
#    这与 `review.yml` 里「绝不 checkout PR 代码」的约束不冲突：那里检出的是不可信内容，
#    这里检出的是主分支自己的代码。
# 3. 报告写到常设 Issue（或 Wiki）。不要用 open 状态的 Issue 当载体，那会持续要求注意力。
name: 代码巡检

on:
  schedule:
    # 每月 1 日 02:00 UTC（北京 10:00）。太频繁没有意义：指标要一个月才看得出趋势。
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write # Wiki 载体需要；只用 Issue 时可降为 read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          mode: inspect
          api-key: ${{ secrets.AI_REVIEW_API_KEY }}
          # 不传 github-token：action.yml 会回落到内置的 github.token。
          # 写成 secrets.GITHUB_TOKEN 虽然也能用，但那个名字容易让人以为自己要建一个同名 secret

      # 历史文件进仓库后，趋势在本地跑与 CI 跑之间是连续的
      - name: 提交本期历史
        run: |
          if [ -f .acr/inspection-history.json ]; then
            git config user.name 'acr-bot'
            git config user.email 'acr-bot@users.noreply.github.com'
            git add .acr/inspection-history.json
            git diff --staged --quiet || git commit -m "chore: 记录巡检历史"
            git push
          fi
